<div class="main-container">
    <div class="p-6 sm:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl sm:text-5xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">PrepStream</h1>
            <p class="text-lg text-indigo-200 mt-2">Paste your notes, get AI-powered summaries and flashcards.</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <app-note-input 
                (generationStarted)="onGenerationStarted()" 
                (summaryGenerated)="onSummaryGenerated($event)">
            </app-note-input>
            <app-flashcards></app-flashcards>
        </main>


        <div *ngIf="summary" class="mt-12">
             <div class="glass-panel p-8 summary-section max-w-4xl mx-auto">
                <div class="flex items-center justify-center gap-3 mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                    <h2 class="text-3xl font-bold text-gray-100">Summary</h2>
                </div>
                <div class="summary-text" [innerHTML]="summary | safeHtml"></div>
             </div>
        </div>
        <!-- ^^^ END OF NEW SECTION ^^^ -->
    </div>
</div>
